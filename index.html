<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d2b53">
<title>BeCloud</title>
<style>
:root{--bg1:#1d2b53;--bg2:#3d4f8f;--panel:#27386b;--line:#4a5e9f;--ink:#f4f7ff;--mute:#aab6e0;--sun:#ffc15e;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:16px/1.45 "Trebuchet MS",Verdana,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:420px}
.logo{position:relative;text-align:center;margin:28px 0 8px;font-size:44px;font-weight:700;letter-spacing:.5px}
.logo:before,.logo:after{content:"";position:absolute;z-index:-1;border-radius:50%;background:rgba(255,255,255,.12)}
.logo:before{width:120px;height:70px;left:50%;top:-6px;transform:translateX(-95%)}
.logo:after{width:150px;height:84px;left:50%;top:-16px;transform:translateX(-10%)}
.logo span{color:var(--sun)}
#sub{text-align:center;color:var(--mute);margin:0 0 24px}
section{display:flex;flex-direction:column;gap:12px}
button{font:inherit;font-weight:700;color:#1d2b53;background:var(--sun);border:0;border-radius:12px;padding:15px 18px;cursor:pointer}
button.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
button.ghost{background:none;color:var(--mute);border:0;padding:6px 8px;font-weight:400}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.me{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.me img{width:44px;height:44px;border-radius:50%;background:var(--line)}
.me div{flex:1;min-width:0}
.me b,.me small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--mute)}
.note{border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--panel)}
.note.bad{border-color:var(--bad);color:#ffd9d9}
.note button{margin-top:10px;width:100%}
#err{color:#ffd9d9;text-align:center;min-height:1.4em}
#ver{text-align:center;color:var(--mute);font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="logo">Be<span>Cloud</span></div>
  <p id="sub">Подключаемся…</p>

  <section id="login" hidden>
    <button id="btnLogin">Войти через Google</button>
    <div id="err"></div>
  </section>

  <section id="menu" hidden>
    <div class="me">
      <img id="ava" alt="">
      <div><b id="nick"></b><small id="mail"></small></div>
      <button class="ghost" id="btnOut">Выйти</button>
    </div>
    <div id="notice"></div>
    <button id="btnOnline">Играть онлайн</button>
    <button class="alt" id="btnBots">Играть с ботами</button>
    <button class="alt" id="btnSkins" disabled>Скины: скоро</button>
    <button class="alt" id="btnHost" hidden>Панель хоста</button>
    <div id="ver"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// 1) Вставь свои значения из Firebase: Project settings → Your apps → Web app → Config
const FIREBASE_CONFIG = {
  apiKey: "ВСТАВЬ_API_KEY",
  authDomain: "becloud-gaming-platform.firebaseapp.com",
  databaseURL: "https://becloud-gaming-platform-default-rtdb.firebaseio.com",
  projectId: "becloud-gaming-platform",
  appId: "ВСТАВЬ_APP_ID"
};
// 2) Номер версии, которая лежит на хостинге. Поднимай вместе с /config/version в Firebase.
const BUILD = 1;
const GAME_FILE = "game.html";

const $ = id => document.getElementById(id);
const show = id => { ["login", "menu"].forEach(x => $(x).hidden = x !== id); };
const mailKey = e => e.toLowerCase().replace(/\./g, ",");

if (FIREBASE_CONFIG.apiKey.startsWith("ВСТАВЬ")) {
  $("sub").textContent = "Открой index.html и вставь firebaseConfig (apiKey и appId).";
} else {
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), db = firebase.database();
  let remote = null, banned = false, isHost = false, user = null;

  db.ref("config/version").on("value", s => { remote = s.val(); render(); });

  $("btnLogin").onclick = () => {
    $("err").textContent = "";
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => { $("err").textContent = "Не удалось войти (" + e.code + ")"; });
  };
  $("btnOut").onclick = () => auth.signOut();

  auth.onAuthStateChanged(async u => {
    user = u;
    if (!u) { $("sub").textContent = "Войди, чтобы играть"; show("login"); return; }
    try {
      await db.ref("users/" + u.uid + "/profile").update({
        email: u.email,
        name: (u.displayName || "Игрок").slice(0, 24),
        photo: u.photoURL || "",
        lastLogin: firebase.database.ServerValue.TIMESTAMP
      });
    } catch (e) { console.warn("profile", e); }
    const read = async p => { try { return (await db.ref(p).once("value")).exists(); } catch (e) { return false; } };
    const k = mailKey(u.email || "");
    const [b1, b2, h] = await Promise.all([read("bans/" + u.uid), read("bannedEmails/" + k), read("hostEmails/" + k)]);
    banned = b1 || b2; isHost = h;
    $("ava").src = u.photoURL || ""; $("nick").textContent = u.displayName || "Игрок"; $("mail").textContent = u.email;
    $("sub").textContent = "Добро пожаловать";
    show("menu"); render();
  });

  function render() {
    if (!user) return;
    const outdated = remote !== null && remote > BUILD;
    const n = $("notice"); n.innerHTML = "";
    if (banned) n.innerHTML = '<div class="note bad">Аккаунт заблокирован. Онлайн недоступен.</div>';
    else if (outdated) {
      n.innerHTML = '<div class="note">Вышла новая версия (' + remote + '). Пока вы не обновились, доступна только игра с ботами.<button id="btnUpd">Обновить</button></div>';
      $("btnUpd").onclick = () => { location.href = location.pathname + "?r=" + Date.now(); };
    }
    $("btnOnline").disabled = banned || outdated || remote === null;
    $("btnHost").hidden = !isHost;
    $("ver").textContent = "Версия " + BUILD + (remote !== null ? " · актуальная " + remote : "");
  }

  $("btnOnline").onclick = async () => {
    try {
      await db.ref("presence/" + user.uid).set({ ver: remote, t: firebase.database.ServerValue.TIMESTAMP });
      location.href = GAME_FILE + "?mode=online&v=" + remote;
    } catch (e) { $("notice").innerHTML = '<div class="note bad">Сервер не принял версию. Обновите страницу.</div>'; }
  };
  $("btnBots").onclick = () => { location.href = GAME_FILE + "?mode=bots&v=" + BUILD; };
  $("btnHost").onclick = () => alert("Панель хоста будет на следующем этапе.");
}
</script>
</body>
</html>
